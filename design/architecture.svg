<svg width="1160" height="640" viewBox="0 0 1160 640" xmlns="http://www.w3.org/2000/svg" font-family="Georgia,'Times New Roman',serif">
  <rect width="1160" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fafafa;stroke:#1a1a1a;stroke-width:1.2}
    .boxi{fill:#ffffff;stroke:#1a1a1a;stroke-width:1}
    .t{fill:#000000;font-size:15px;font-weight:700;font-family:Georgia,serif}
    .s{fill:#444444;font-size:11.5px;font-family:Georgia,serif}
    .l{fill:#111111;font-size:12.5px;font-family:'Courier New',monospace}
    .edge{stroke:#1a1a1a;stroke-width:1.4;fill:none;marker-end:url(#arr)}
    .h{fill:#333333;font-size:13px;font-family:Georgia,serif}
  </style>

  <text x="580" y="30" text-anchor="middle" class="h">Arquitectura — agente computer-use sobre escritorio remoto (solo píxeles)</text>

  <!-- JUEZ -->
  <rect class="box" x="30" y="55" width="190" height="70"/>
  <text class="t" x="125" y="90" text-anchor="middle">JUEZ</text>
  <text class="s" x="125" y="110" text-anchor="middle">Bearer · evaluación</text>

  <!-- SERVICIO HTTP -->
  <rect class="box" x="30" y="195" width="300" height="175"/>
  <text class="t" x="180" y="222" text-anchor="middle">SERVICIO HTTP</text>
  <text class="s" x="180" y="240" text-anchor="middle">FastAPI · contenedor único</text>
  <text class="l" x="45" y="264">GET  /health  →  200</text>
  <text class="l" x="45" y="284">POST /tasks  →  202 {task_id}</text>
  <text class="l" x="45" y="304">GET  /tasks/{id}  →  estado</text>
  <text class="s" x="45" y="344">auth Bearer · cola asyncio + workers</text>

  <!-- COLA -->
  <rect class="box" x="370" y="200" width="170" height="70"/>
  <text class="t" x="455" y="232" text-anchor="middle">COLA</text>
  <text class="s" x="455" y="252" text-anchor="middle">asyncio.Queue</text>

  <!-- STORE -->
  <rect class="box" x="370" y="300" width="170" height="70"/>
  <text class="t" x="455" y="332" text-anchor="middle">STORE</text>
  <text class="s" x="455" y="352" text-anchor="middle">SQLite · estado</text>

  <!-- WORKER -->
  <rect class="box" x="580" y="150" width="300" height="280"/>
  <text class="t" x="730" y="176" text-anchor="middle">WORKER (por tarea · ≤5 min)</text>
  <rect class="boxi" x="600" y="196" width="260" height="44"/>
  <text class="t" x="730" y="223" text-anchor="middle" font-size="13">Desktop I/O · VNC + puente</text>
  <rect class="boxi" x="600" y="250" width="260" height="44"/>
  <text class="t" x="730" y="277" text-anchor="middle" font-size="13">Percepción · crop / diff / OCR</text>
  <rect class="boxi" x="600" y="304" width="260" height="44"/>
  <text class="t" x="730" y="331" text-anchor="middle" font-size="13">Cognición · PLAN / ACT / CHECK</text>
  <rect class="boxi" x="600" y="358" width="260" height="44"/>
  <text class="t" x="730" y="385" text-anchor="middle" font-size="13">Modelos · OpenRouter (visión)</text>

  <!-- ESCRITORIO -->
  <rect class="box" x="920" y="150" width="220" height="180"/>
  <text class="t" x="1030" y="176" text-anchor="middle" font-size="14">ESCRITORIO REMOTO</text>
  <text class="s" x="1030" y="194" text-anchor="middle">noVNC · websockify · VNC</text>
  <rect class="boxi" x="940" y="206" width="180" height="104"/>
  <text class="t" x="1030" y="230" text-anchor="middle">App legacy</text>
  <text class="s" x="1030" y="248" text-anchor="middle">SIGECOM (y 5 más)</text>
  <text class="s" x="1030" y="266" text-anchor="middle">framebuffer 1280×800</text>
  <text class="s" x="1030" y="284" text-anchor="middle">solo píxeles · sin DOM</text>

  <!-- OBSERVABILIDAD -->
  <rect class="box" x="580" y="470" width="560" height="55"/>
  <text class="t" x="860" y="503" text-anchor="middle" font-size="13">OBSERVABILIDAD · JSONL por tarea + screenshots → evidencia</text>

  <!-- edges -->
  <path class="edge" d="M125 125 L125 195"/>
  <text class="s" x="135" y="168" font-size="10.5">Bearer</text>
  <path class="edge" d="M330 235 L370 235"/>
  <path class="edge" d="M330 335 L370 335"/>
  <path class="edge" d="M540 235 L580 235"/>
  <path class="edge" d="M860 218 L920 218"/>
  <text class="s" x="868" y="212" font-size="10.5">capture()</text>
  <text class="s" x="868" y="227" font-size="10.5">input()</text>
  <path class="edge" d="M730 430 L730 470"/>
</svg>
